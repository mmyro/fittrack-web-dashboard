server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Files with a hash in the name never change, so they can be cached for a long time
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single page app: unknown paths return index.html and React Router handles them
  location / {
    try_files $uri $uri/ /index.html;
  }
}